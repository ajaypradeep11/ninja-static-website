name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_VAPI_PUBLIC_KEY: ${{ vars.VITE_VAPI_PREVIEW_PUBLIC_KEY }}
          VITE_VAPI_CLINIC_PUBLIC_KEY: ${{ vars.VITE_VAPI_PREVIEW_CLINIC_PUBLIC_KEY }}
          VITE_VAPI_CLINIC_ASSISTANT_ID: ${{ vars.VITE_VAPI_PREVIEW_CLINIC_ASSISTANT_ID }}
          VITE_VAPI_DEALER_ASSISTANT_ID: ${{ vars.VITE_VAPI_PREVIEW_DEALER_ASSISTANT_ID }}
          VITE_VAPI_RESTAURANT_ASSISTANT_ID: ${{ vars.VITE_VAPI_PREVIEW_RESTAURANT_ASSISTANT_ID }}
          VITE_VAPI_REALTY_ASSISTANT_ID: ${{ vars.VITE_VAPI_PREVIEW_REALTY_ASSISTANT_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCALNINJA_TEST }}
          projectId: localninja-test
